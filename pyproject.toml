[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = [
  "E501",    # the formatter handles the line length
  "PLR2004", # magic values in tests
  "RUF012",  # Home Assistant declares entity and flow defaults as class attributes
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
